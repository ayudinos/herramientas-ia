<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Herramientas IA</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* Ajuste para que la barra de búsqueda se vea mejor en móviles */
    .search input {
      color: #333 !important;
    }
  </style>
</head>
<body>
  <div id="app">Cargando catálogo...</div>
  <script>
    window.$docsify = {
      name: 'Herramientas Dev IA',
      repo: 'ayudinos/herramientas-ia',
      loadSidebar: true,   // 1. CAMBIA ESTO A TRUE
      subMaxLevel: 2,      // 2. ESTO CREA EL SUBMENÚ DE LA TABLA DE CONTENIDOS
      homepage: 'index.md', // Fuerza a usar tu archivo de datos
      loadSidebar: false,   // Cambiar a true si creas un archivo _sidebar.md
      subMaxLevel: 3,
      externalLinkTarget: '_blank', // Abre links externos en pestaña nueva
      
      // CONFIGURACIÓN DEL BUSCADOR
      search: {
        maxAge: 0, // 0 para que limpie la caché vieja y reconozca el español
        paths: 'auto',
        placeholder: {
          '/': '🔍 Escribe para buscar...'
        },
        noData: {
          '/': '❌ No se encontraron resultados'
        },
        depth: 6
      }
    }
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
</body>
</html>
